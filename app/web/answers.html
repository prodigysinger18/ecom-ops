<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真实模型答案 · 人工审核</title><style>body{font:16px system-ui;color:#24334a;background:#f2f5fa;margin:0}main{max-width:960px;margin:32px auto;padding:24px}section{background:white;padding:24px;border-radius:16px;margin:20px 0}input,select,button{font:inherit;padding:10px;border:1px solid #ccd6e5;border-radius:8px;box-sizing:border-box}input,select{width:100%;margin:8px 0 15px}button{background:#245ac7;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;background:#f5f8ff;padding:18px;border-radius:8px}p{line-height:1.7;color:#63748a}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><h1>审核真实模型回答</h1><p>请逐条核对答案、证据和参考要点。模型自检通过不等于人工审核通过；未审核指标保持为空。</p><section><label>管理员访问令牌<input id="token" type="password" autocomplete="off"></label><label>实际审核人<input id="reviewer"></label><button id="load">加载真实评测答案</button><p id="status" role="status" aria-live="polite">尚未加载</p></section>
<section id="panel" hidden><label>选择答案<select id="cases"></select></label><h2 id="question"></h2><p id="state"></p><h3>模型回答</h3><pre id="answer"></pre><h3>参考检查要点</h3><pre id="reference"></pre><details><summary>查看证据原文</summary><pre id="citations"></pre></details><div class="row"><label>答案是否正确且完整<select id="correct"><option value="">请选择</option><option value="true">是</option><option value="false">否</option></select></label><label>是否包含无依据事实<select id="hallucination"><option value="">请选择</option><option value="true">是</option><option value="false">否</option></select></label><label>可验证事实总数<input id="total" type="number" min="0" max="100"></label><label>有证据支持的事实数<input id="supported" type="number" min="0" max="100"></label></div><label><input id="confirmed" type="checkbox" style="width:auto"> 我已实际审核并逐条计数</label><button id="save">保存审核并计算指标</button><pre id="metrics">尚无本次保存的审核指标</pre></section><p><a href="/review">审核问题标签</a> · <a href="/demo">咨询演示</a></p></main><script>
const $=id=>document.getElementById(id);let rows=[],runId='';
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{Authorization:'Bearer '+$('token').value.trim(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'审核请求未通过校验');return d;}
function show(){const r=rows[Number($('cases').value)];if(!r)return;$('question').textContent=r.question;$('state').textContent='实验组：'+r.profile+' · 执行结果：'+r.status+' · '+(r.review.reviewed?'已审核':'待审核');$('answer').textContent=r.answer;$('reference').textContent=r.reference_answer;$('citations').textContent=(r.citations||[]).map(c=>c.document_key+' / '+c.section+'\n'+c.quote).join('\n\n')||'无引用证据';$('correct').value=r.review.answer_correct===null?'':String(r.review.answer_correct);$('hallucination').value=r.review.has_hallucination===null?'':String(r.review.has_hallucination);$('total').value=r.review.claims_total??'';$('supported').value=r.review.claims_supported??'';$('confirmed').checked=false;}
$('load').onclick=async()=>{try{const d=await api('/api/v1/evaluation/answers');rows=d.answers;runId=d.run_id;$('cases').replaceChildren();rows.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(r.review.reviewed?'✓ ':'待审 ')+r.profile+' / '+r.id;$('cases').append(o);});$('panel').hidden=false;show();$('status').textContent='加载 '+rows.length+' 条回答';}catch(e){$('status').textContent=e.message;}};
$('cases').onchange=show;$('save').onclick=async()=>{if(!$('confirmed').checked||!$('reviewer').value.trim()||!$('correct').value||!$('hallucination').value||$('total').value===''||$('supported').value===''){$('status').textContent='请填写所有判断和事实数，并确认已审核';return;}const i=Number($('cases').value),r=rows[i];$('save').disabled=true;try{const d=await api('/api/v1/evaluation/answers/'+encodeURIComponent(r.profile)+'/'+encodeURIComponent(r.id),'PATCH',{etag:r.etag,run_id:runId,reviewer:$('reviewer').value.trim(),answer_correct:$('correct').value==='true',has_hallucination:$('hallucination').value==='true',claims_total:Number($('total').value),claims_supported:Number($('supported').value),confirmed:true});r.review=d.review;r.etag=d.etag;$('metrics').textContent=JSON.stringify(d.metrics,null,2);$('cases').options[i].textContent='✓ '+r.profile+' / '+r.id;show();$('status').textContent='已保存本题的人审结果';}catch(e){$('status').textContent=e.message;}finally{$('save').disabled=false;}};
</script></body></html>
