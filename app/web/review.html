<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>评测人工审核</title><style>body{font:16px system-ui;color:#24334a;background:#f2f5fa;margin:0}main{max-width:900px;margin:32px auto;padding:24px}section{background:white;padding:24px;border-radius:16px;margin:20px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #ccd6e5;border-radius:8px;box-sizing:border-box}input,select,textarea{width:100%;margin:8px 0 15px}textarea{min-height:90px}button{background:#245ac7;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block}pre{white-space:pre-wrap}p{line-height:1.7;color:#63748a}</style></head><body><main><h1>逐题审核评测标签</h1><p>这是人工审核工作台。请实际核对问题、答案要点与必要证据后再保存，不能把合成数据标成真实客户数据。</p>
<section><label>管理员访问令牌<input id="token" type="password" autocomplete="off"></label><label>实际审核人<input id="reviewer" placeholder="填写你的姓名或审核编号"></label><button id="load">加载候选题</button><p id="status" role="status" aria-live="polite">尚未加载</p></section>
<section id="panel" hidden><label>选择问题<select id="cases"></select></label><h2 id="question"></h2><p id="origin"></p><label>预期路由<select id="route"></select></label><label>参考答案／检查要点<textarea id="reference"></textarea></label><label>必要证据文档编号（逗号分隔）<input id="evidence"></label><label>预期处理方式<input id="handling"></label><label><input id="confirmed" type="checkbox" style="width:auto"> 我已核对本题及证据</label><button id="save">保存人工审核</button><details><summary>查看知识库证据</summary><pre id="corpus"></pre></details></section><p><a href="/demo">返回咨询演示</a></p>
<p><a href="/answer-review">审核模型答案与质量指标</a></p></main><script>
const $=id=>document.getElementById(id);let rows=[],corpus=[];const routes=['faq_rag','business_tool','order_modify','fallback','human_request','safety_block','clarification'];routes.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;$('route').append(o);});
function show(){const row=rows[Number($('cases').value)];if(!row)return;$('question').textContent=row.question;$('origin').textContent='来源：'+row.origin+' · '+(row.reviewed?'已由 '+row.reviewer+' 审核':'待人工审核');$('route').value=row.expected_route;$('reference').value=row.reference_answer;$('evidence').value=row.necessary_evidence.join(',');$('handling').value=row.expected_handling;$('confirmed').checked=false;$('corpus').textContent=corpus.map(c=>c.key+' / '+c.title+'\n'+c.content).join('\n\n');}
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{Authorization:'Bearer '+$('token').value.trim(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'审核请求校验失败');return data;}
$('load').onclick=async()=>{try{const d=await api('/api/v1/evaluation/cases');rows=d.cases;corpus=d.corpus;$('cases').replaceChildren();rows.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(r.reviewed?'✓ ':'待审 ')+r.id;$('cases').append(o);});$('panel').hidden=false;show();$('status').textContent='加载 '+rows.length+' 题';}catch(e){$('status').textContent=e.message;}};
$('cases').onchange=show;
$('save').onclick=async()=>{if(!$('confirmed').checked||!$('reviewer').value.trim()){$('status').textContent='请填写审核人并确认已核对本题';return;}const index=Number($('cases').value),row=rows[index];$('save').disabled=true;try{rows[index]=await api('/api/v1/evaluation/cases/'+encodeURIComponent(row.id),'PATCH',{etag:row.etag,reviewer:$('reviewer').value.trim(),expected_route:$('route').value,reference_answer:$('reference').value,necessary_evidence:$('evidence').value.split(',').map(s=>s.trim()).filter(Boolean),expected_handling:$('handling').value,confirmed:true});$('cases').options[index].textContent='✓ '+row.id;show();$('status').textContent='已保存 '+row.id+' 的实际人工审核';}catch(e){$('status').textContent=e.message;}finally{$('save').disabled=false;}};
</script></body></html>
