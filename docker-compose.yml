services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/ecom_ops.db
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
  worker:
    build: .
    command: celery -A app.tasks.worker.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: sqlite:///./data/ecom_ops.db
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
